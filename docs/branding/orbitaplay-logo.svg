      <path d="M442 62 V170 A30 30 0 0 0 472 200 M424 104 H470"/>
      <!-- a -->
      <circle cx="547" cy="150" r="38"/><path d="M585 100 V200"/>
      <!-- p -->
      <path d="M627 100 V250"/><circle cx="665" cy="150" r="38"/>
      <!-- l -->
      <path d="M747 50 V170 A30 30 0 0 0 777 200"/>
      <!-- a -->
