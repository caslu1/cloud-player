name: Release APK

# Publishes Cloud-Player.apk as a GitHub release when a version tag (e.g. v1.1) is pushed.
# Public download link: https://github.com/caslu1/cloud-player/releases/latest/download/Cloud-Player.apk
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match versionName, e.g. v1.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/*.apk Cloud-Player.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NOTES="Cloud Player ${TAG#v}

          Download: https://github.com/${{ github.repository }}/releases/latest/download/Cloud-Player.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Cloud-Player.apk --clobber
          else
            gh release create "$TAG" Cloud-Player.apk --title "Cloud Player ${TAG#v}" --notes "$NOTES" --target "${{ github.sha }}"
          fi
