name: Adicionar playlist no funplays

on:
  workflow_dispatch:
    inputs:
      mac:
        description: "MAC do aparelho (ex: aa:bb:cc:dd:ee:ff)"
        required: true
      device_key:
        description: "Device Key"
        required: true
      m3u_url:
        description: "Link M3U"
        required: true
      name:
        description: "Nome da playlist"
        required: false
        default: "Playlist"

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ocultar dados sensiveis no log
        run: |
          echo "::add-mask::${{ inputs.device_key }}"
          echo "::add-mask::${{ inputs.m3u_url }}"
      - name: Enviar playlist
        env:
          MAC: ${{ inputs.mac }}
          KEY: ${{ inputs.device_key }}
          URL: ${{ inputs.m3u_url }}
          NAME: ${{ inputs.name }}
        run: python3 tools/funplays/funplays_add.py --mac "$MAC" --key "$KEY" --url "$URL" --name "$NAME"
