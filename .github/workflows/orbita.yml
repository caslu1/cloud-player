name: Orbita Play APK

# Compila o app Orbita Play e publica as fotos das telas para aprovação.
# O APK só vai para o link fixo quando a publicação é aprovada (execução manual):
# https://github.com/caslu1/cloud-player/releases/download/orbita-play/Orbita-Play.apk
on:
  push:
    paths:
      - 'orbita/**'
      - '.github/workflows/orbita.yml'
      - 'settings.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbita-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (GitHub secret)
        env:
          KS: ${{ secrets.ORBITA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/orbita-release.jks"; echo "ORBITA_KEYSTORE_FILE=$RUNNER_TEMP/orbita-release.jks" >> "$GITHUB_ENV"; fi
          # publicar só com a chave oficial
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "$KS" ]; then echo "Falta o segredo ORBITA_KEYSTORE_B64"; exit 1; fi
      - name: Build
        env:
          ORBITA_SITE_URL: ${{ vars.ORBITA_SITE_URL }}
          ORBITA_KEYSTORE_PASSWORD: ${{ secrets.ORBITA_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :orbita:testDebugUnitTest :orbita:assembleRelease || { find orbita/build/test-results -name "*.xml" -exec grep -l "<failure" {} + | xargs -r sed -n "/<failure/,/<\/failure>/p" | head -120; exit 1; }
          cp orbita/build/outputs/apk/release/*.apk Orbita-Play.apk
          ls -la Orbita-Play.apk
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls orbita/build/screens/*.png 2>/dev/null || exit 0
          gh release upload orbita-play orbita/build/screens/*.png --clobber || true
      - uses: actions/upload-artifact@v4
        with:
          name: Orbita-Play
          path: Orbita-Play.apk
      - name: Publish release
        # só depois da aprovação do dono (execução manual); envios normais geram apenas as fotos
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=orbita-play
          NOTES="Orbita Play – player IPTV para Android TV, Google TV, Fire TV e TV box.

          Download: https://github.com/${{ github.repository }}/releases/download/$TAG/Orbita-Play.apk
          Esta versão: https://github.com/${{ github.repository }}/releases/download/$TAG/Orbita-Play-v${{ github.run_number }}.apk

          Build: ${{ github.sha }}"
          # remove rascunhos duplicados do mesmo tag (sobra de builds simultâneos)
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG\" and .draft) | .id" \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/releases/{}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Orbita Play" --notes "$NOTES" --target "${{ github.sha }}" --latest=false
          fi
          gh release upload "$TAG" Orbita-Play.apk --clobber
          # link com o número da versão: nunca fica em cache no Downloader/navegador
          cp Orbita-Play.apk "Orbita-Play-v${{ github.run_number }}.apk"
          gh release upload "$TAG" "Orbita-Play-v${{ github.run_number }}.apk" --clobber
