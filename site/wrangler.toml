# Site de ativação do Orbita Play (Cloudflare Workers + banco D1)
name = "orbita-ativar"
account_id = "ba148b95a1617379822bbe7f4c2dcae7"
main = "src/index.js"
compatibility_date = "2025-09-01"

# domínio oficial (o endereço workers.dev continua funcionando)
workers_dev = true
routes = [
  { pattern = "orbitaplay.app", custom_domain = true },
  { pattern = "www.orbitaplay.app", custom_domain = true },
  { pattern = "painel.orbitaplay.app", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "orbita"
database_id = "b354929a-f5f0-423f-8d7a-0dc318797e07"

[vars]
SITE_NAME = "Orbita Play"
# Segredos (não ficam no código), configure com:
#   npx wrangler secret put ADMIN_PASSWORD     (senha do painel admin)
#   npx wrangler secret put SESSION_SECRET     (texto aleatório longo)
#   npx wrangler secret put MP_ACCESS_TOKEN    (token do Mercado Pago, para o Pix)
